---
name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (pre-commit)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Run pre-commit
              run: make lint

    build-smoke:
        name: Build + Smoke (Vagrant)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            # Drive the Vagrantfile's libvirt provider, not VirtualBox.
            VAGRANT_DEFAULT_PROVIDER: libvirt
        steps:
            - uses: actions/checkout@v5

            # Ubuntu 24.04 dropped the `vagrant` package, and VirtualBox can't
            # run here: the runner's KVM already owns the CPU virtualization
            # extension (VirtualBox dies with VERR_SVM_IN_USE). So we drive
            # Vagrant through libvirt/QEMU-KVM -- using the KVM that's already
            # loaded -- and install Vagrant itself from HashiCorp's APT repo.
            - name: Install Vagrant + libvirt/KVM
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq \
                      qemu-kvm libvirt-daemon-system libvirt-clients libvirt-dev \
                      ebtables dnsmasq-base build-essential pkg-config
                  keyring=/usr/share/keyrings/hashicorp-archive-keyring.gpg
                  wget -qO- https://apt.releases.hashicorp.com/gpg \
                      | sudo gpg --dearmor -o "$keyring"
                  repo="deb [signed-by=$keyring] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                  echo "$repo" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq vagrant
                  sudo systemctl enable --now libvirtd 2>/dev/null || true
                  sudo usermod -aG libvirt "$USER"
                  vagrant plugin install vagrant-libvirt

            - name: Cache Vagrant boxes
              uses: actions/cache@v4
              with:
                  path: ~/.vagrant.d/boxes
                  key: vagrant-boxes-${{ hashFiles('examples/prplos/Vagrantfile') }}

            - name: Show docker / buildx / vagrant versions
              run: |
                  docker version
                  docker buildx version
                  vagrant --version
                  vagrant plugin list
                  virsh --version

            - name: Build all images
              run: make build

            # `sg libvirt` runs make under the libvirt group so vagrant can
            # reach the system libvirtd socket without a re-login. usermod
            # above added the runner to the group but the running shell won't
            # pick it up otherwise.
            - name: Smoke (Vagrant + libvirt)
              run: sg libvirt -c "make smoke"

            - name: Collect failure artifacts
              if: failure()
              run: |
                  set +e
                  tar czf ci-smoke-artifacts.tar.gz smoke.log
                  ls -l ci-smoke-artifacts.tar.gz || true

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: smoke-failure-${{ github.run_id }}
                  path: ci-smoke-artifacts.tar.gz
                  if-no-files-found: ignore

            - name: Teardown VM
              if: always()
              run: sg libvirt -c "make smoke-down"
