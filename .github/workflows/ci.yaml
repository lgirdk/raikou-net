---
name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (pre-commit)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Run pre-commit
              run: make lint

    build-smoke:
        name: Build + Smoke (Vagrant)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            # GitHub-hosted ubuntu-latest (24.04) no longer ships Vagrant or
            # VirtualBox, and Ubuntu 24.04 dropped the `vagrant` package from
            # its repos entirely. VirtualBox is still in Ubuntu's multiverse;
            # Vagrant now has to come from HashiCorp's official APT repo.
            - name: Install Vagrant + VirtualBox
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq virtualbox
                  keyring=/usr/share/keyrings/hashicorp-archive-keyring.gpg
                  wget -qO- https://apt.releases.hashicorp.com/gpg \
                      | sudo gpg --dearmor -o "$keyring"
                  repo="deb [signed-by=$keyring] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                  echo "$repo" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq vagrant

            - name: Cache Vagrant boxes
              uses: actions/cache@v4
              with:
                  path: ~/.vagrant.d/boxes
                  key: vagrant-boxes-${{ hashFiles('examples/prplos/Vagrantfile') }}

            - name: Show docker / buildx / vagrant versions
              run: |
                  docker version
                  docker buildx version
                  vagrant --version

            - name: Build all images
              run: make build

            - name: Smoke (Vagrant)
              run: make smoke

            - name: Collect failure artifacts
              if: failure()
              run: |
                  set +e
                  tar czf ci-smoke-artifacts.tar.gz smoke.log
                  ls -l ci-smoke-artifacts.tar.gz || true

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: smoke-failure-${{ github.run_id }}
                  path: ci-smoke-artifacts.tar.gz
                  if-no-files-found: ignore

            - name: Teardown VM
              if: always()
              run: make smoke-down
