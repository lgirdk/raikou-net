---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.16.3
      hooks:
          - id: commitizen
            stages: [commit-msg]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-ast
            stages: [pre-commit]
          - id: end-of-file-fixer
            stages: [pre-commit]
          - id: mixed-line-ending
            stages: [pre-commit]
          - id: check-toml
            stages: [pre-commit]
          - id: trailing-whitespace
            exclude: cm-cfg
            stages: [pre-commit]
          - id: check-docstring-first
            stages: [pre-commit]
          - id: check-yaml
            stages: [pre-commit]
          - id: check-json
            stages: [pre-commit]
          - id: pretty-format-json
            args: [--autofix, --indent=4]
            stages: [pre-commit]
          - id: check-added-large-files
            args: [--maxkb=3000]
            stages: [pre-commit]
          - id: check-merge-conflict
            stages: [pre-commit]
          - id: debug-statements
            stages: [pre-commit]
          - id: check-executables-have-shebangs
            language: python
            files: \.py$
            stages: [pre-commit]
    - repo: https://github.com/Lucas-C/pre-commit-hooks
      rev: v1.5.6
      hooks:
          - id: remove-crlf
            stages: [pre-commit]
          - id: remove-tabs
            # Makefiles need literal recipe-line tabs; never de-tab.
            exclude: (cm-cfg|(^|/)Makefile$)
            stages: [pre-commit]
          - id: forbid-crlf
            stages: [pre-commit]
          - id: forbid-tabs
            # Makefiles need literal recipe-line tabs.
            exclude: (cm-cfg|(^|/)Makefile$)
            stages: [pre-commit]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
            stages: [pre-commit]
    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.38.0
      hooks:
          - id: yamllint
            args: [--format, parsable]
            stages: [pre-commit]
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.15
      hooks:
          - id: ruff-check
            args: [--fix]
            stages: [pre-commit]
          - id: ruff-format
            stages: [pre-commit]
    - repo: https://github.com/akaihola/darglint2
      rev: v1.8.2
      hooks:
          - id: darglint2
            args: [--docstring-style, sphinx]
            stages: [pre-commit]
